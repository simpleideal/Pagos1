<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruma</title>
    <meta name="description" content="Pantalla del personal de Cervecería Bruma.">
    <meta name="theme-color" content="#120c09">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bruma">
    <link rel="manifest" href="admin.webmanifest">
    <link rel="apple-touch-icon" href="img/admin-icono-192.png">
    <link rel="icon" href="img/admin-icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f6efe3;
            --cream-soft: #e7dccb;
            --verde: #1f8f4e;
            --gris: #8a847c;
            --tinta: #1a120c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--cream);
            background: #120c09 url("img/fachada.jpg") center 42% / cover no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(8, 5, 3, 0.82);
        }

        :focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 3px;
        }

        main {
            width: min(560px, 100%);
            margin: 0 auto;
            padding: 22px 16px 40px;
        }

        h1 {
            font-family: Fraunces, Georgia, serif;
            font-size: clamp(2.4rem, 8vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
            margin: 8px 0 18px;
        }

        h2 {
            font-family: Fraunces, Georgia, serif;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .ejemplo {
            margin-bottom: 14px;
            color: var(--cream-soft);
            font-size: 1.15rem;
        }

        .aviso {
            margin-bottom: 14px;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
        }

        button,
        summary {
            font: inherit;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
        }

        button:disabled { opacity: 0.45; }

        .panel {
            padding: 18px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.58);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        label {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
        }

        input[type="password"],
        .precio-input {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 14px 16px;
            border: 0;
            border-radius: 12px;
            background: rgba(246, 239, 227, 0.12);
            color: var(--cream);
            font: inherit;
            font-size: 1.6rem;
        }

        .entrar,
        .grande,
        .volver,
        .confirmar,
        .rechazar,
        .listo,
        .quitar,
        .fija button {
            width: 100%;
            min-height: 72px;
            font-size: 1.45rem;
            font-weight: 700;
        }

        .entrar,
        .grande,
        .volver,
        .fija button {
            background: var(--cream);
            color: var(--tinta);
        }

        .grande {
            min-height: 104px;
            margin-bottom: 14px;
            font-family: Fraunces, Georgia, serif;
            font-size: 2rem;
        }

        .volver { margin-bottom: 8px; }

        .cambiar,
        .sonido {
            margin-top: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            background: transparent;
            color: var(--cream);
            font-size: 1.15rem;
            font-weight: 700;
            border: 1px solid rgba(246, 239, 227, 0.45);
        }

        .tarjeta {
            margin-bottom: 14px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.58);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        .telefono {
            display: inline-block;
            margin: 10px 0 4px;
            color: var(--cream);
            font-size: 1.45rem;
            font-weight: 700;
        }

        .confirmar,
        .rechazar,
        .listo,
        .quitar {
            margin-top: 10px;
        }

        .confirmar { background: var(--verde); color: var(--cream); }
        .rechazar,
        .listo,
        .quitar { background: var(--gris); color: var(--tinta); }

        .pregunta {
            margin-top: 12px;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .vacio {
            font-size: 1.5rem;
            color: var(--cream-soft);
        }

        details {
            margin-top: 18px;
        }

        summary {
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
        }

        #vista-reservas { padding-bottom: 110px; }

        .fija {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: rgba(8, 5, 3, 0.94);
        }

        .fija button { max-width: 560px; display: block; margin: 0 auto; }

        .interruptor {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .estado {
            flex: 1;
            min-height: 64px;
            background: transparent;
            color: var(--cream);
            border: 1px solid rgba(246, 239, 227, 0.45);
            font-size: 1.35rem;
            font-weight: 700;
        }

        .estado.activo { background: var(--cream); color: var(--tinta); }

        .precio {
            display: block;
            width: 100%;
            margin-top: 12px;
            min-height: 64px;
            background: transparent;
            color: var(--cream);
            border: 1px solid rgba(246, 239, 227, 0.35);
            font-size: 1.7rem;
            font-weight: 700;
        }

        .oferta {
            margin-top: 8px;
        }

        .mesas {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 8px 0 18px;
        }

        .mesa {
            width: 84px;
            height: 84px;
            background: transparent;
            color: var(--cream);
            border: 1px solid rgba(246, 239, 227, 0.5);
            font-family: Fraunces, Georgia, serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .mesa.elegida { background: var(--cream); color: var(--tinta); }

        .personas {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0 16px;
        }

        .personas p {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .paso {
            width: 72px;
            height: 72px;
            background: var(--cream);
            color: var(--tinta);
            font-size: 2rem;
            font-weight: 700;
        }

        #personas-num {
            min-width: 48px;
            font-family: Fraunces, Georgia, serif;
            font-size: 2.4rem;
            text-align: center;
        }

        .acciones {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <form class="panel" id="vista-clave" data-vista="clave">
            <h1>Bruma</h1>
            <label>Clave de la barra
                <input id="clave" type="password" name="clave" autocomplete="current-password" required>
            </label>
            <button class="entrar" type="submit">Entrar</button>
            <p class="aviso" id="clave-espera" hidden>Un momento…</p>
            <p class="aviso" id="clave-error" hidden>Clave incorrecta</p>
        </form>

        <section id="vista-inicio" data-vista="inicio" hidden>
            <h1>Bruma</h1>
            <p class="ejemplo" id="ejemplo-inicio" hidden>Ejemplo</p>
            <button type="button" class="grande" data-ir="reservas">Reservas</button>
            <button type="button" class="grande" data-ir="llamados">Llamados</button>
            <button type="button" class="grande" data-ir="carta">Carta</button>
            <button type="button" class="cambiar" id="cambiar">Cambiar clave</button>
        </section>

        <section id="vista-reservas" data-vista="reservas" hidden>
            <button type="button" class="volver" data-ir="inicio">Volver</button>
            <h1>Pendientes</h1>
            <p class="ejemplo" data-ejemplo="reservas" hidden>Ejemplo</p>
            <p class="aviso" id="aviso-reservas" hidden></p>
            <div id="lista-pendientes"></div>
            <p class="vacio" id="vacio-pendientes" hidden>No hay pendientes.</p>
            <details id="confirmadas">
                <summary>Confirmadas hoy</summary>
                <div id="lista-confirmadas"></div>
            </details>
            <div class="fija">
                <button type="button" data-ir="llegada">Llegó sin reserva</button>
            </div>
        </section>

        <section id="vista-llegada" data-vista="llegada" hidden>
            <button type="button" class="volver" data-ir="reservas">Volver</button>
            <h1>¿Qué mesa?</h1>
            <p class="aviso" id="aviso-llegada" hidden></p>
            <div class="mesas" id="mesas-libre"></div>
            <p class="vacio" id="sin-mesas" hidden>No hay mesas libres.</p>
            <div class="personas">
                <p>Personas</p>
                <button type="button" class="paso" id="personas-menos" aria-label="Menos">−</button>
                <p id="personas-num">2</p>
                <button type="button" class="paso" id="personas-mas" aria-label="Más">+</button>
            </div>
            <button type="button" class="entrar" id="llegada-listo">Listo</button>
        </section>

        <section id="vista-llamados" data-vista="llamados" hidden>
            <button type="button" class="volver" data-ir="inicio">Volver</button>
            <h1>Llamados</h1>
            <p class="ejemplo" data-ejemplo="llamados" hidden>Ejemplo</p>
            <div class="acciones">
                <button type="button" class="sonido" id="sonido" aria-pressed="false">Activar sonido</button>
            </div>
            <p class="aviso" id="aviso-llamados" hidden></p>
            <div id="lista-llamados"></div>
            <p class="vacio" id="vacio-llamados" hidden>No hay llamados.</p>
        </section>

        <section id="vista-carta" data-vista="carta" hidden>
            <button type="button" class="volver" data-ir="inicio">Volver</button>
            <h1>Carta</h1>
            <p class="ejemplo" data-ejemplo="carta" hidden>Ejemplo</p>
            <p class="aviso" id="aviso-carta" hidden></p>
            <div id="lista-carta"></div>
        </section>
    </main>
    <script src="js/reservas-url.js"></script>
    <script src="js/llamados.js"></script>
    <script src="js/admin-api.js"></script>
    <script src="js/sala-llamados.js"></script>
    <script src="js/mesas.js"></script>
    <script src="js/ocupadas.js"></script>
    <script src="js/admin-ui.js"></script>
</body>
</html>
