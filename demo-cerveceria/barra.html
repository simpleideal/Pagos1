<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llamados · Cervecería Bruma</title>
    <meta name="description" content="Pantalla de la barra para los llamados al mesero. Datos de ejemplo.">
    <meta name="theme-color" content="#120c09">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f6efe3;
            --cream-soft: #e7dccb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--cream);
            background: #120c09 url("img/fachada.jpg") center 42% / cover no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(8, 5, 3, 0.82);
        }

        :focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 3px;
        }

        main {
            width: min(720px, 100%);
            margin: 0 auto;
            padding: 28px 20px 64px;
        }

        .demo {
            margin-bottom: 16px;
            color: var(--cream-soft);
            font-size: 1rem;
            line-height: 1.4;
        }

        h1 {
            font-family: Fraunces, Georgia, serif;
            font-size: clamp(2.4rem, 6vw, 3.4rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 18px;
        }

        .panel {
            padding: 18px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.58);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        input {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 12px 14px;
            border: 0;
            border-radius: 8px;
            background: rgba(246, 239, 227, 0.12);
            color: var(--cream);
            font: inherit;
            font-size: 1.35rem;
        }

        button {
            appearance: none;
            border: 1px solid rgba(246, 239, 227, 0.45);
            border-radius: 8px;
            background: transparent;
            color: var(--cream);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .entrar,
        .listo,
        .sonido {
            margin-top: 14px;
            padding: 12px 18px;
            font-size: 1.25rem;
        }

        .error {
            margin-top: 14px;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .barra-acciones {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            margin-bottom: 18px;
        }

        .sonido {
            padding: 10px 14px;
            font-size: 1rem;
        }

        .sesion {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(246, 239, 227, 0.28);
        }

        .salir {
            min-height: 48px;
            padding: 12px 18px;
            border-radius: 999px;
            border: 1.5px solid #d47a6e;
            background: #f4d0c8;
            color: #3d1814;
            font-size: 1.05rem;
        }

        .sesion > .salir { width: 100%; }

        .salir-confirma { margin-top: 12px; }

        .salir-confirma .pregunta {
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .salir-sino { display: flex; gap: 8px; }

        .salir-sino button {
            flex: 1;
            min-height: 48px;
            font-size: 1.15rem;
        }

        .sonido { margin-top: 0; }

        .vacio {
            font-size: 1.6rem;
            color: var(--cream-soft);
        }

        .tarjeta {
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.58);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        .tarjeta h2 {
            font-family: Fraunces, Georgia, serif;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <p class="demo" id="demo" hidden>Demo · los llamados se guardan en este navegador. Cualquier clave sirve.</p>
        <h1>Llamados</h1>

        <form class="panel" id="clave-form">
            <label>Clave de la barra
                <input id="clave" type="password" name="clave" autocomplete="current-password" required>
            </label>
            <button class="entrar" type="submit">Entrar</button>
            <p class="error" id="clave-error" hidden>Clave incorrecta</p>
        </form>

        <section id="sala" hidden>
            <div class="barra-acciones">
                <button type="button" class="sonido" id="sonido" aria-pressed="false">Activar sonido</button>
            </div>
            <p class="error" id="sala-aviso" hidden></p>
            <div id="lista"></div>
            <p class="vacio" id="vacio" hidden>No hay llamados.</p>
            <div class="sesion">
                <button type="button" class="salir" id="salir">Salir</button>
                <div id="salir-confirma" class="salir-confirma" hidden>
                    <p class="pregunta">¿Cerrar sesión en este teléfono?</p>
                    <div class="salir-sino">
                        <button type="button" class="salir" id="salir-si">Sí</button>
                        <button type="button" id="salir-no">No</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/reservas-url.js"></script>
    <script src="js/llamados.js"></script>
    <script src="js/sala-llamados.js"></script>
    <script>
        (function () {
            var CLAVE_GUARDADA = 'bruma-clave-barra';
            var form = document.getElementById('clave-form');
            var campo = document.getElementById('clave');
            var error = document.getElementById('clave-error');
            var sala = document.getElementById('sala');
            var lista = document.getElementById('lista');
            var vacio = document.getElementById('vacio');
            var demo = document.getElementById('demo');
            var sonidoBtn = document.getElementById('sonido');
            var aviso = document.getElementById('sala-aviso');
            var claveActual = '';
            var salaCtrl = null;

            if (window.BRUMA_LLAMADOS.esDemo()) demo.hidden = false;

            function leerClave() {
                try { return localStorage.getItem(CLAVE_GUARDADA) || ''; }
                catch (error) { return ''; }
            }

            function guardarClave(valor) {
                try { localStorage.setItem(CLAVE_GUARDADA, valor); }
                catch (error) {}
            }

            function borrarClave() {
                try { localStorage.removeItem(CLAVE_GUARDADA); }
                catch (error) {}
                try { sessionStorage.removeItem(CLAVE_GUARDADA); }
                catch (error) {}
            }

            function parar() {
                if (salaCtrl) {
                    salaCtrl.parar();
                    salaCtrl = null;
                }
            }

            function mostrarFormulario() {
                parar();
                sala.hidden = true;
                form.hidden = false;
                campo.focus();
            }

            function claveMala() {
                borrarClave();
                error.hidden = false;
                error.textContent = 'Clave incorrecta';
                mostrarFormulario();
            }

            function empezar(clave) {
                claveActual = clave;
                parar();
                salaCtrl = window.BRUMA_SALA.montar({
                    clave: clave,
                    demo: false,
                    lista: lista,
                    vacio: vacio,
                    sonidoBtn: sonidoBtn,
                    alReintentar: function () {
                        if (sala.hidden) {
                            error.hidden = false;
                            error.textContent = 'El script tardó. Reintentando…';
                        } else if (aviso) {
                            aviso.hidden = false;
                            aviso.textContent = 'El script tardó. Reintentando…';
                        }
                    },
                    onOk: function () {
                        error.hidden = true;
                        if (aviso) aviso.hidden = true;
                        form.hidden = true;
                        sala.hidden = false;
                        guardarClave(claveActual);
                    },
                    onClaveMala: claveMala,
                    onFallo: function (tipo) {
                        if (tipo === 'leer') borrarClave();
                        error.hidden = false;
                        error.textContent = 'No se pudo leer los llamados.';
                        mostrarFormulario();
                    }
                });
            }

            form.addEventListener('submit', function (evento) {
                evento.preventDefault();
                error.hidden = true;
                empezar(campo.value);
            });

            document.getElementById('salir').addEventListener('click', function () {
                document.getElementById('salir').hidden = true;
                document.getElementById('salir-confirma').hidden = false;
            });
            document.getElementById('salir-no').addEventListener('click', function () {
                document.getElementById('salir-confirma').hidden = true;
                document.getElementById('salir').hidden = false;
            });
            document.getElementById('salir-si').addEventListener('click', function () {
                document.getElementById('salir-confirma').hidden = true;
                document.getElementById('salir').hidden = false;
                borrarClave();
                claveActual = '';
                campo.value = '';
                error.hidden = true;
                if (aviso) aviso.hidden = true;
                mostrarFormulario();
            });

            var guardada = leerClave();
            if (guardada) empezar(guardada);
        })();
    </script>
</body>
</html>
