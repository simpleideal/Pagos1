<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de obras</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
    <style>
        :root {
            --bg: #f3f5f6;
            --card: #ffffff;
            --line: #d8dee2;
            --teal: #0b7a7c;
            --teal-oscuro: #065f61;
            --text: #1a2226;
            --muted: #5c676e;
            --pill: #e6eaed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
            padding: 24px 16px calc(32px + env(safe-area-inset-bottom, 0px));
        }

        main {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        header { margin-bottom: 20px; }

        .oficio {
            color: var(--teal);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.7rem;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 6px;
        }

        .persona {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .datos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 600;
        }

        .presentacion {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        h2 {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 22px 0 10px;
        }

        .zonas {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .zonas button {
            border: none;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            background: var(--pill);
            color: var(--text);
            cursor: pointer;
        }

        .zonas button[aria-pressed="true"] {
            background: var(--teal);
            color: #ffffff;
        }

        .obras { display: grid; gap: 14px; }

        .vacio {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 18px 4px;
        }

        article {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
        }

        article img {
            display: block;
            width: 100%;
            height: 168px;
            object-fit: cover;
            background: #d8dee2;
            cursor: zoom-in;
        }

        .obra { padding: 12px 14px 14px; }

        article h3 {
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .meta {
            color: var(--muted);
            font-size: 0.82rem;
            margin-bottom: 8px;
        }

        .obra p {
            color: var(--text);
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .acciones {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .acciones a {
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            padding: 13px 14px;
            font-weight: 700;
        }

        .principal {
            background: var(--teal);
            color: #ffffff;
        }

        .secundario {
            border: 1px solid var(--teal);
            color: var(--teal-oscuro);
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="oficio" id="oficio"></p>
            <h1 id="nombre"></h1>
            <p class="persona" id="persona"></p>
            <div class="datos" id="datos"></div>
            <p class="presentacion" id="presentacion"></p>
        </header>

        <h2>Obras por zona</h2>
        <div class="zonas" id="zonas" role="group" aria-label="Filtrar por zona"></div>
        <section class="obras" id="obras" aria-label="Obras ejecutadas"></section>

        <div class="acciones">
            <a class="principal" id="botonWhatsapp" target="_blank" rel="noopener">Pedir cotización por WhatsApp</a>
            <a class="secundario" id="botonLlamar">Llamar</a>
        </div>
    </main>

    <script>
        /* ==================================================================
           DATOS DEL PORTAFOLIO

           Esto es lo único que se cambia para un llavero nuevo.
           ================================================================== */

        const EMPRESA = {
            titulo: 'Portafolio de obras - Obras Rivera',
            nombre: 'Obras Rivera',
            persona: 'Héctor Rivera Soto',
            oficio: 'Construcción · obras menores',
            anios: '12 años',
            cobertura: 'Osorno y otras comunas',
            presentacion: 'Obras ejecutadas en ciudad, lago e interior. Se muestra trabajo hecho, no una lista de servicios.'
        };

        const CONTACTO = {
            telefono: '+56944445555',
            whatsapp: '56944445555',
            mensajeWhatsapp: 'Hola Héctor, vi el portafolio de Obras Rivera y quiero cotizar un trabajo.'
        };

        /* "id" de cada zona es lo que se pone en obra.zona */
        const ZONAS = [
            { id: 'todas', nombre: 'Todas' },
            { id: 'ciudad', nombre: 'Ciudad' },
            { id: 'lago', nombre: 'Lago y costa' },
            { id: 'interior', nombre: 'Interior' }
        ];

        /* foto: URL pública. En un llavero real van fotos propias del cliente. */
        const OBRAS = [
            {
                titulo: 'Ampliación de vivienda',
                zona: 'ciudad',
                lugar: 'Rahue, Osorno',
                anio: '2024',
                metros: '42 m²',
                nota: 'Dormitorio y baño adosados a casa existente, con radier y cubierta de zincalum.',
                foto: 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Remodelación de local',
                zona: 'ciudad',
                lugar: 'Osorno centro',
                anio: '2022',
                metros: '65 m²',
                nota: 'Tabiquería, cielo y piso para un local de barrio. Entrega en 18 días.',
                foto: 'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Radier y cierre perimetral',
                zona: 'lago',
                lugar: 'Puerto Octay',
                anio: '2023',
                metros: '180 m²',
                nota: 'Plataforma de hormigón para galpón agrícola y reja perimetral.',
                foto: 'https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Casa de veraneo',
                zona: 'lago',
                lugar: 'Entre Lagos',
                anio: '2024',
                metros: '78 m²',
                nota: 'Estructura, cubierta y terminaciones de una casa junto al lago.',
                foto: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Cambio de techumbre',
                zona: 'interior',
                lugar: 'Río Negro',
                anio: '2023',
                metros: '90 m²',
                nota: 'Retiro de teja rota, estructura revisada y cubierta nueva.',
                foto: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Galpón de faena',
                zona: 'interior',
                lugar: 'Purranque',
                anio: '2021',
                metros: '220 m²',
                nota: 'Estructura metálica y radier para un galpón de faena.',
                foto: 'https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=800&q=60'
            }
        ];

        /* ==================================================================
           FIN DE LOS DATOS DEL PORTAFOLIO
           ================================================================== */

        let zonaActiva = 'todas';
        let moduloPhotoSwipe = null;
        const FOTO_ANCHO = 1600;
        const FOTO_ALTO = 1067;

        function urlFotoGrande(src) {
            return String(src).replace(/w=\d+/, 'w=' + FOTO_ANCHO);
        }

        async function abrirGaleria(indice) {
            const obras = obrasFiltradas();
            if (!obras.length) return;
            if (!moduloPhotoSwipe) {
                moduloPhotoSwipe = await import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js');
            }
            const pswp = new moduloPhotoSwipe.default({
                dataSource: obras.map((obra) => ({
                    src: urlFotoGrande(obra.foto),
                    width: FOTO_ANCHO,
                    height: FOTO_ALTO,
                    alt: obra.titulo,
                    caption: [obra.titulo, obra.lugar, obra.anio].filter(Boolean).join(' · ')
                })),
                index: indice || 0,
                bgOpacity: 0.92,
                pinchToClose: true,
                wheelToZoom: true
            });
            pswp.init();
        }

        function obrasFiltradas() {
            if (zonaActiva === 'todas') return OBRAS;
            return OBRAS.filter((obra) => obra.zona === zonaActiva);
        }

        function renderZonas() {
            const nav = document.getElementById('zonas');
            nav.replaceChildren();
            ZONAS.forEach((zona) => {
                const boton = document.createElement('button');
                boton.type = 'button';
                boton.textContent = zona.nombre;
                boton.setAttribute('aria-pressed', zona.id === zonaActiva ? 'true' : 'false');
                boton.addEventListener('click', () => {
                    zonaActiva = zona.id;
                    renderZonas();
                    renderObras();
                });
                nav.appendChild(boton);
            });
        }

        function renderObras() {
            const lista = document.getElementById('obras');
            lista.replaceChildren();
            const filas = obrasFiltradas();

            if (!filas.length) {
                const vacio = document.createElement('p');
                vacio.className = 'vacio';
                vacio.textContent = 'No hay obras en esta zona.';
                lista.appendChild(vacio);
                return;
            }

            filas.forEach((obra, indice) => {
                const articulo = document.createElement('article');
                const img = document.createElement('img');
                img.src = obra.foto;
                img.alt = obra.titulo;
                img.loading = 'lazy';
                img.referrerPolicy = 'no-referrer';
                img.setAttribute('role', 'button');
                img.tabIndex = 0;
                img.title = 'Ver foto grande';
                const abrir = () => abrirGaleria(indice);
                img.addEventListener('click', abrir);
                img.addEventListener('keydown', (evento) => {
                    if (evento.key === 'Enter' || evento.key === ' ') {
                        evento.preventDefault();
                        abrir();
                    }
                });

                const cuerpo = document.createElement('div');
                cuerpo.className = 'obra';
                cuerpo.innerHTML = '<h3></h3><p class="meta"></p><p class="nota"></p>';
                cuerpo.querySelector('h3').textContent = obra.titulo;
                cuerpo.querySelector('.meta').textContent =
                    [obra.lugar, obra.anio, obra.metros].filter(Boolean).join(' · ');
                cuerpo.querySelector('.nota').textContent = obra.nota;

                articulo.appendChild(img);
                articulo.appendChild(cuerpo);
                lista.appendChild(articulo);
            });
        }

        function aplicarPortafolio() {
            document.title = EMPRESA.titulo;
            document.getElementById('oficio').textContent = EMPRESA.oficio;
            document.getElementById('nombre').textContent = EMPRESA.nombre;
            document.getElementById('persona').textContent = EMPRESA.persona;
            document.getElementById('presentacion').textContent = EMPRESA.presentacion;

            const datos = document.getElementById('datos');
            [EMPRESA.anios, EMPRESA.cobertura].forEach((texto) => {
                const chip = document.createElement('span');
                chip.className = 'chip';
                chip.textContent = texto;
                datos.appendChild(chip);
            });

            const wa = 'https://wa.me/' + CONTACTO.whatsapp +
                '?text=' + encodeURIComponent(CONTACTO.mensajeWhatsapp);
            document.getElementById('botonWhatsapp').href = wa;
            document.getElementById('botonLlamar').href = 'tel:' + CONTACTO.telefono;

            renderZonas();
            renderObras();
        }

        aplicarPortafolio();
    </script>
</body>
</html>
