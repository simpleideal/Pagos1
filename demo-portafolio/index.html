<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de obras</title>
    <style>
        :root {
            --bg: #0e1114;
            --card: #181c21;
            --line: rgba(255, 255, 255, 0.10);
            --accent: #d5dbe1;
            --text: #eef1f4;
            --muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
            padding: 64px 16px calc(110px + env(safe-area-inset-bottom, 0px));
        }

        .demo-barra {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1200;
            display: inline-flex;
            align-items: center;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(12, 12, 12, 0.78);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        main {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 22px;
        }

        .oficio {
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.7rem;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 6px;
        }

        .persona {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .datos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 600;
        }

        .presentacion {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        h2 {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 26px 0 12px;
        }

        .obras { display: grid; gap: 14px; }

        article {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
        }

        article img {
            display: block;
            width: 100%;
            height: 168px;
            object-fit: cover;
            background: #23282e;
        }

        .obra {
            padding: 12px 14px 14px;
        }

        article h3 {
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .meta {
            color: var(--muted);
            font-size: 0.82rem;
            margin-bottom: 8px;
        }

        .obra p {
            color: var(--text);
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .acciones {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .acciones a {
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            padding: 13px 14px;
            font-weight: 700;
        }

        .principal {
            background: var(--accent);
            color: #111418;
        }

        .secundario {
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 58px;
            height: 58px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        .whatsapp-float svg { width: 32px; height: 32px; fill: #fff; }
    </style>
</head>
<body>
    <a class="demo-barra" href="../">← Muestras · datos inventados</a>

    <main>
        <header>
            <p class="oficio" id="oficio"></p>
            <h1 id="nombre"></h1>
            <p class="persona" id="persona"></p>
            <div class="datos" id="datos"></div>
            <p class="presentacion" id="presentacion"></p>
        </header>

        <h2>Obras ejecutadas</h2>
        <section class="obras" id="obras" aria-label="Obras ejecutadas"></section>

        <div class="acciones">
            <a class="principal" id="botonWhatsapp" target="_blank" rel="noopener">Pedir cotización por WhatsApp</a>
            <a class="secundario" id="botonLlamar">Llamar</a>
        </div>
    </main>

    <a class="whatsapp-float" id="whatsappFloat" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 2a13 13 0 0 0-11.2 19.6L3 29l7.7-2A13 13 0 1 0 16 2zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-4 1 1-3.9-.3-.5A10.6 10.6 0 1 1 16 25.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-.9 1.2-.3.2-.6 0a8 8 0 0 1-2.4-1.5 8.9 8.9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6s.3-.4.4-.6a1.7 1.7 0 0 0 .3-.5.6.6 0 0 0 0-.5c0-.2-.7-1.7-1-2.3s-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.2 2.7 6.4 6.4 0 0 0 1.3 3.4 14.7 14.7 0 0 0 5.7 5 19 19 0 0 0 1.9.7 4.6 4.6 0 0 0 2.1.1 3.4 3.4 0 0 0 2.2-1.6 2.8 2.8 0 0 0 .2-1.5c-.1-.1-.3-.2-.6-.4z"/>
        </svg>
    </a>

    <script>
        /* ==================================================================
           DATOS DEL PORTAFOLIO

           Esto es lo único que se cambia para un llavero nuevo.
           ================================================================== */

        const EMPRESA = {
            titulo: 'Portafolio de obras - Obras Rivera',
            nombre: 'Obras Rivera',
            persona: 'Héctor Rivera Soto',
            oficio: 'Construcción · obras menores',
            anios: '12 años',
            zona: 'Osorno y alrededores',
            presentacion: 'Ampliaciones, radieres, techumbres y locales. Se muestra obra hecha, no una lista de servicios.'
        };

        const CONTACTO = {
            telefono: '+56944445555',
            whatsapp: '56944445555',
            mensajeWhatsapp: 'Hola Héctor, vi el portafolio de Obras Rivera y quiero cotizar un trabajo.'
        };

        /* foto: URL pública. En un llavero real van fotos propias del cliente,
           no de bancos de imágenes. Acá son de Unsplash, solo para la muestra. */
        const OBRAS = [
            {
                titulo: 'Ampliación de vivienda',
                lugar: 'Rahue, Osorno',
                anio: '2024',
                metros: '42 m²',
                nota: 'Dormitorio y baño adosados a casa existente, con radier y cubierta de zincalum.',
                foto: 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Radier y cierre perimetral',
                lugar: 'Puerto Octay',
                anio: '2023',
                metros: '180 m²',
                nota: 'Plataforma de hormigón para galpón agrícola y reja perimetral.',
                foto: 'https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Cambio de techumbre',
                lugar: 'Río Negro',
                anio: '2023',
                metros: '90 m²',
                nota: 'Retiro de teja rota, estructura revisada y cubierta nueva.',
                foto: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=800&q=60'
            },
            {
                titulo: 'Remodelación de local',
                lugar: 'Osorno centro',
                anio: '2022',
                metros: '65 m²',
                nota: 'Tabiquería, cielo y piso para un local de barrio. Entrega en 18 días.',
                foto: 'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=60'
            }
        ];

        /* ==================================================================
           FIN DE LOS DATOS DEL PORTAFOLIO
           ================================================================== */

        function aplicarPortafolio() {
            document.title = EMPRESA.titulo;
            document.getElementById('oficio').textContent = EMPRESA.oficio;
            document.getElementById('nombre').textContent = EMPRESA.nombre;
            document.getElementById('persona').textContent = EMPRESA.persona;
            document.getElementById('presentacion').textContent = EMPRESA.presentacion;

            const datos = document.getElementById('datos');
            [EMPRESA.anios, EMPRESA.zona].forEach((texto) => {
                const chip = document.createElement('span');
                chip.className = 'chip';
                chip.textContent = texto;
                datos.appendChild(chip);
            });

            const wa = 'https://wa.me/' + CONTACTO.whatsapp +
                '?text=' + encodeURIComponent(CONTACTO.mensajeWhatsapp);
            document.getElementById('botonWhatsapp').href = wa;
            document.getElementById('whatsappFloat').href = wa;
            document.getElementById('botonLlamar').href = 'tel:' + CONTACTO.telefono;

            const lista = document.getElementById('obras');
            OBRAS.forEach((obra) => {
                const articulo = document.createElement('article');
                const img = document.createElement('img');
                img.src = obra.foto;
                img.alt = obra.titulo;
                img.loading = 'lazy';
                img.referrerPolicy = 'no-referrer';

                const cuerpo = document.createElement('div');
                cuerpo.className = 'obra';
                cuerpo.innerHTML =
                    '<h3></h3><p class="meta"></p><p class="nota"></p>';
                cuerpo.querySelector('h3').textContent = obra.titulo;
                cuerpo.querySelector('.meta').textContent =
                    [obra.lugar, obra.anio, obra.metros].filter(Boolean).join(' · ');
                cuerpo.querySelector('.nota').textContent = obra.nota;

                articulo.appendChild(img);
                articulo.appendChild(cuerpo);
                lista.appendChild(articulo);
            });
        }

        aplicarPortafolio();
    </script>
</body>
</html>
