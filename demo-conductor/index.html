<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg: #121417;
            --card: #1c2026;
            --line: rgba(255, 255, 255, 0.10);
            --accent: #e8c547;
            --text: #f4f5f7;
            --muted: #9aa3ad;
            --ok: #1f8a4c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% -8%, #3a3420 0%, transparent 40%),
                var(--bg);
            padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px));
        }

        main {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .boton-docs {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: var(--accent);
            color: #1a1404;
            font-weight: 700;
            border-radius: 12px;
            padding: 13px 14px;
            margin-bottom: 8px;
        }

        .nota-docs {
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.4;
            text-align: center;
            margin-bottom: 18px;
        }

        .oficio {
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1.55rem;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 14px;
        }

        .escena {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .escena-auto {
            position: relative;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background: #141820;
        }

        .poster-auto {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        model-viewer {
            display: block;
            position: relative;
            width: 100%;
            height: 280px;
            background: transparent;
            --poster-color: transparent;
        }

        model-viewer[hidden] { display: none; }

        .patente {
            display: block;
            width: 100%;
            margin: 12px 0 0;
            padding: 16px 12px 12px;
            border-radius: 12px;
            background: #f4f4f1;
            color: #111;
            text-align: center;
            box-shadow: inset 0 0 0 3px #111;
            letter-spacing: 0.18em;
            font-weight: 800;
            font-size: 2rem;
            font-family: "Arial Black", Arial, sans-serif;
        }

        .patente small {
            display: block;
            letter-spacing: 0.28em;
            font-size: 0.62rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1d4f9c;
        }

        .datos-auto {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .dato-auto {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .etiqueta {
            display: block;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .valor {
            font-size: 1rem;
            font-weight: 650;
            word-break: break-word;
        }

        .nota {
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.45;
            margin-top: 12px;
        }

        h2 {
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 8px;
        }

        .campo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }

        .campo:last-of-type { border-bottom: none; }

        button, .boton {
            appearance: none;
            border: none;
            font: inherit;
            cursor: pointer;
        }

        .copiar {
            flex-shrink: 0;
            background: rgba(232, 197, 71, 0.14);
            color: var(--accent);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .copiar.ok { background: var(--ok); color: #fff; }

        .boton-ancho {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            padding: 13px 14px;
            font-weight: 700;
            margin-top: 10px;
        }

        .principal {
            background: var(--accent);
            color: #1a1404;
        }

        .secundario {
            border: 1px solid var(--accent);
            color: var(--accent);
            background: transparent;
        }

        .velo {
            position: fixed;
            inset: 0;
            background: rgba(8, 8, 10, 0.55);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .velo.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .hoja {
            position: fixed;
            left: 50%;
            bottom: 0;
            width: min(420px, 100%);
            height: min(86vh, 640px);
            transform: translate(-50%, calc(100% - 72px));
            background: var(--card);
            border-radius: 22px 22px 0 0;
            box-shadow: 0 -10px 32px rgba(0, 0, 0, 0.35);
            z-index: 50;
            display: flex;
            flex-direction: column;
            transition: transform 0.28s ease;
            touch-action: none;
        }

        .hoja.abierta { transform: translate(-50%, 0); }
        .hoja.arrastrando { transition: none; }

        .hoja-cabeza {
            flex-shrink: 0;
            padding: 10px 16px 8px;
            text-align: center;
            cursor: grab;
        }

        .asa {
            display: block;
            width: 36px;
            height: 4px;
            margin: 0 auto 10px;
            border-radius: 999px;
            background: #4a4538;
        }

        .hoja-rubro {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .hoja-titulo {
            font-size: 1.25rem;
            font-weight: 750;
        }

        .hoja-cuerpo {
            overflow-y: auto;
            padding: 4px 16px 28px;
            touch-action: pan-y;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 88px;
            transform: translateX(-50%) translateY(12px);
            background: #111;
            color: #fff;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 60;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <main>
        <a class="boton-docs" id="botonPdf" target="_blank" rel="noopener">Documentos de persona y vehículo</a>
        <p class="nota-docs" id="notaPdf"></p>

        <p class="oficio" id="oficio"></p>
        <h1 id="nombre"></h1>

        <section class="escena" aria-label="Identificar el auto">
            <div class="escena-auto">
                <svg class="poster-auto" viewBox="0 0 640 360" role="img" aria-hidden="true">
                    <rect width="640" height="360" fill="#141820"/>
                    <ellipse cx="320" cy="278" rx="200" ry="20" fill="#000" opacity="0.35"/>
                    <g fill="#2c313a" stroke="#e8c547" stroke-width="6" stroke-linejoin="round">
                        <path d="M86 256 v-20 h70 c12-44 36-68 72-68 h58 c26-46 70-70 118-70 h48 c38 0 64 16 86 48 h42 c26 0 38 16 38 36 v52 h-28 v22 H86 z"/>
                    </g>
                    <path fill="#3d4450" stroke="#e8c547" stroke-width="5" d="M278 104 h92 c22 0 42 10 58 32 H312 c-12-20-26-32-42-32z"/>
                    <circle cx="198" cy="244" r="32" fill="#12141a" stroke="#e8c547" stroke-width="6"/>
                    <circle cx="198" cy="244" r="12" fill="#e8c547"/>
                    <circle cx="454" cy="244" r="32" fill="#12141a" stroke="#e8c547" stroke-width="6"/>
                    <circle cx="454" cy="244" r="12" fill="#e8c547"/>
                </svg>
                <model-viewer
                    id="auto3d"
                    alt="Silueta genérica de un auto"
                    hidden
                    camera-controls
                    auto-rotate
                    shadow-intensity="1"
                    exposure="1.05"
                    camera-orbit="25deg 72deg 105%"
                    touch-action="pan-y">
                </model-viewer>
            </div>
            <span class="patente"><small>CHILE</small><span id="valorPatente"></span></span>
            <div class="datos-auto">
                <div class="dato-auto">
                    <span class="etiqueta">Color</span>
                    <p class="valor" id="valorColor"></p>
                </div>
                <div class="dato-auto">
                    <span class="etiqueta">Modelo</span>
                    <p class="valor" id="valorModelo"></p>
                </div>
            </div>
            <p class="nota" id="notaAuto"></p>
        </section>
    </main>

    <div class="velo" id="velo" hidden></div>
    <aside class="hoja" id="hoja" aria-label="Datos de transferencia">
        <div class="hoja-cabeza" id="asa">
            <span class="asa" aria-hidden="true"></span>
            <p class="hoja-rubro">Pagar la carrera</p>
            <p class="hoja-titulo">Transferencia</p>
        </div>
        <div class="hoja-cuerpo">
            <div class="campo">
                <div>
                    <span class="etiqueta">Nombre</span>
                    <p class="valor" id="valorNombre"></p>
                </div>
                <button type="button" class="copiar" data-copiar="nombre">Copiar</button>
            </div>
            <div class="campo">
                <div>
                    <span class="etiqueta">RUT</span>
                    <p class="valor" id="valorRut"></p>
                </div>
                <button type="button" class="copiar" data-copiar="rut">Copiar</button>
            </div>
            <div class="campo">
                <div>
                    <span class="etiqueta">Banco</span>
                    <p class="valor" id="valorBanco"></p>
                </div>
            </div>
            <div class="campo">
                <div>
                    <span class="etiqueta">Tipo de cuenta</span>
                    <p class="valor" id="valorTipo"></p>
                </div>
            </div>
            <div class="campo">
                <div>
                    <span class="etiqueta">N° de cuenta</span>
                    <p class="valor" id="valorCuenta"></p>
                </div>
                <button type="button" class="copiar" data-copiar="cuenta">Copiar</button>
            </div>
            <button type="button" class="boton-ancho principal" id="btnCopiarTodo">Copiar todos los datos</button>
            <a class="boton-ancho secundario" id="botonWhatsapp" target="_blank" rel="noopener">Mandar comprobante por WhatsApp</a>
        </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        /* ==================================================================
           DATOS DEL CONDUCTOR

           Inventados. Esto es lo único que se cambia para un llavero nuevo.
           ================================================================== */

        const CONDUCTOR = {
            titulo: 'Conductor - Diego Morales',
            oficio: 'Viaje · conductor',
            nombre: 'Diego Morales'
        };

        const CUENTA = {
            nombre: 'Diego Morales Vargas',
            rut: '17.284.519-3',
            banco: 'BancoEstado',
            tipoCuenta: 'CuentaRUT',
            cuenta: '17284519'
        };

        const CONTACTO = {
            whatsapp: '56977778888',
            mensajeWhatsapp: 'Hola Diego, te mando el comprobante de la transferencia.'
        };

        const AUTO = {
            patente: 'RPKD-12',
            color: 'Negro',
            modelo: 'Hyundai Accent',
            glb: 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/ToyCar/glTF-Binary/ToyCar.glb',
            poster: 'auto-poster.svg',
            nota: 'Silueta genérica: no es el auto real. Se identifica por el color negro y la patente RPKD-12.'
        };

        const FISCAL = {
            pdf: 'documentos/permiso-muestra.pdf',
            clave: '1234',
            nota: 'Para inspector. PDF de muestra, persona y vehículo. Clave 1234.'
        };

        /* ==================================================================
           FIN DE LOS DATOS DEL CONDUCTOR
           ================================================================== */

        const ASOMO_HOJA = 72;
        let yaAbrioPorScroll = false;

        function textoCuenta() {
            return [
                'Nombre: ' + CUENTA.nombre,
                'RUT: ' + CUENTA.rut,
                'Banco: ' + CUENTA.banco,
                'Tipo de cuenta: ' + CUENTA.tipoCuenta,
                'Número de cuenta: ' + CUENTA.cuenta
            ].join('\n');
        }

        function valorDe(clave) {
            if (clave === 'nombre') return CUENTA.nombre;
            if (clave === 'rut') return CUENTA.rut;
            if (clave === 'cuenta') return CUENTA.cuenta;
            return textoCuenta();
        }

        function copiaLegacy(texto) {
            const area = document.createElement('textarea');
            area.value = texto;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            let exito = false;
            try {
                exito = document.execCommand('copy');
            } catch (e) {
                exito = false;
            }
            document.body.removeChild(area);
            return exito;
        }

        async function copiar(texto) {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(texto);
                    return true;
                } catch (e) {
                    /* cae al respaldo */
                }
            }
            return copiaLegacy(texto);
        }

        let toastTimer;
        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 2200);
        }

        async function copiarCampo(clave, boton) {
            const ok = await copiar(valorDe(clave));
            if (boton) {
                const original = boton.dataset.texto || boton.textContent;
                boton.dataset.texto = original;
                boton.textContent = ok ? 'Listo' : 'Error';
                boton.classList.toggle('ok', ok);
                setTimeout(() => {
                    boton.textContent = original;
                    boton.classList.remove('ok');
                }, 1600);
            }
            mostrarToast(ok ? 'Copiado' : 'No se pudo copiar');
        }

        function abrirHoja() {
            document.getElementById('hoja').classList.add('abierta');
            const velo = document.getElementById('velo');
            velo.hidden = false;
            velo.classList.add('visible');
        }

        function cerrarHoja() {
            document.getElementById('hoja').classList.remove('abierta');
            const velo = document.getElementById('velo');
            velo.classList.remove('visible');
            velo.hidden = true;
        }

        function arrancarHoja() {
            const hoja = document.getElementById('hoja');
            const asa = document.getElementById('asa');
            const velo = document.getElementById('velo');
            let inicioY = 0;
            let abiertaAlEmpezar = false;
            let arrastro = false;

            asa.addEventListener('click', (evento) => {
                if (arrastro) {
                    arrastro = false;
                    evento.preventDefault();
                    return;
                }
                if (hoja.classList.contains('abierta')) cerrarHoja();
                else abrirHoja();
            });

            velo.addEventListener('click', cerrarHoja);

            asa.addEventListener('pointerdown', (evento) => {
                inicioY = evento.clientY;
                abiertaAlEmpezar = hoja.classList.contains('abierta');
                hoja.classList.add('arrastrando');
                asa.setPointerCapture(evento.pointerId);
            });

            asa.addEventListener('pointermove', (evento) => {
                if (!asa.hasPointerCapture(evento.pointerId)) return;
                const delta = evento.clientY - inicioY;
                const base = abiertaAlEmpezar ? 0 : hoja.offsetHeight - ASOMO_HOJA;
                const siguiente = Math.max(0, Math.min(hoja.offsetHeight - ASOMO_HOJA, base + delta));
                hoja.style.transform = 'translate(-50%, ' + siguiente + 'px)';
            });

            asa.addEventListener('pointerup', (evento) => {
                if (!asa.hasPointerCapture(evento.pointerId)) return;
                asa.releasePointerCapture(evento.pointerId);
                hoja.classList.remove('arrastrando');
                hoja.style.transform = '';
                const delta = evento.clientY - inicioY;
                arrastro = Math.abs(delta) > 10;
                if (abiertaAlEmpezar && delta > 50) cerrarHoja();
                else if (!abiertaAlEmpezar && delta < -40) abrirHoja();
            });

            window.addEventListener('scroll', () => {
                if (yaAbrioPorScroll) return;
                const sobra = document.documentElement.scrollHeight -
                    (window.scrollY + window.innerHeight);
                if (sobra < 48) {
                    yaAbrioPorScroll = true;
                    abrirHoja();
                }
            }, { passive: true });

            if (location.hash === '#transferencia') abrirHoja();
        }

        function aplicarConductor() {
            document.title = CONDUCTOR.titulo;
            document.getElementById('oficio').textContent = CONDUCTOR.oficio;
            document.getElementById('nombre').textContent = CONDUCTOR.nombre;
            document.getElementById('valorNombre').textContent = CUENTA.nombre;
            document.getElementById('valorRut').textContent = CUENTA.rut;
            document.getElementById('valorBanco').textContent = CUENTA.banco;
            document.getElementById('valorTipo').textContent = CUENTA.tipoCuenta;
            document.getElementById('valorCuenta').textContent = CUENTA.cuenta;
            document.getElementById('valorPatente').textContent = AUTO.patente;
            document.getElementById('valorColor').textContent = AUTO.color;
            document.getElementById('valorModelo').textContent = AUTO.modelo;
            document.getElementById('notaAuto').textContent = AUTO.nota;
            document.getElementById('notaPdf').textContent = FISCAL.nota;
            const auto3d = document.getElementById('auto3d');
            auto3d.setAttribute('poster', AUTO.poster);
            auto3d.addEventListener('load', () => {
                auto3d.hidden = false;
            });
            auto3d.setAttribute('src', AUTO.glb);
            document.getElementById('botonPdf').href = FISCAL.pdf;
            document.getElementById('botonWhatsapp').href =
                'https://wa.me/' + CONTACTO.whatsapp +
                '?text=' + encodeURIComponent(CONTACTO.mensajeWhatsapp);

            document.querySelectorAll('[data-copiar]').forEach((boton) => {
                boton.addEventListener('click', () => copiarCampo(boton.dataset.copiar, boton));
            });
            document.getElementById('btnCopiarTodo').addEventListener('click', (evento) => {
                copiarCampo('todo', evento.currentTarget);
            });
            arrancarHoja();
        }

        aplicarConductor();
    </script>
</body>
</html>
