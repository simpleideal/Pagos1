<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta</title>
    <style>
        :root {
            --bg: #f6efe6;
            --card: #fffdf9;
            --line: #e4d4c4;
            --accent: #b4532a;
            --accent-oscuro: #8a3d1d;
            --text: #2a211c;
            --muted: #6d5c50;
            --foto: 112px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
            padding: 24px 16px calc(28px + env(safe-area-inset-bottom, 0px));
        }

        main {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        header { margin-bottom: 18px; }

        .oficio {
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-family: Didot, "Bodoni MT", "Times New Roman", serif;
            font-size: 2rem;
            letter-spacing: 0.04em;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .lugar {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .datos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 600;
        }

        .presentacion {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .secciones {
            display: flex;
            gap: 16px;
            margin: 8px 0 14px;
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
        }

        .secciones button {
            border: none;
            background: none;
            padding: 8px 0 10px;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .secciones button[aria-pressed="true"] {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .platos { display: grid; gap: 10px; }

        article {
            display: flex;
            gap: 12px;
            align-items: stretch;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px;
        }

        .cuerpo-plato {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        article h3 {
            font-family: Didot, "Bodoni MT", "Times New Roman", serif;
            font-size: 1.12rem;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .nota {
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.4;
            flex: 1;
        }

        .meta {
            margin-top: 10px;
            color: var(--text);
            font-size: 0.88rem;
            font-weight: 600;
        }

        .precio { color: var(--accent-oscuro); }

        .foto {
            position: relative;
            width: var(--foto);
            height: var(--foto);
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #e4d4c4;
        }

        .pista {
            display: flex;
            height: 100%;
            transition: transform 0.45s ease;
        }

        .pista img {
            width: var(--foto);
            height: var(--foto);
            object-fit: cover;
            flex-shrink: 0;
        }

        .puntos {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 6px;
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .puntos span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
        }

        .puntos span.activo { background: #ffffff; }

        .acciones {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .acciones a.principal,
        .acciones a.secundario {
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            padding: 13px 14px;
            font-weight: 700;
        }

        .principal {
            background: var(--accent);
            color: #fffdf9;
        }

        .secundario {
            border: 1px solid var(--accent);
            color: var(--accent-oscuro);
        }

        .redes {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 8px;
        }

        .red-social {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--accent-oscuro);
            display: grid;
            place-items: center;
        }

        .red-social svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

    </style>
</head>
<body>
    <main>
        <header>
            <p class="oficio" id="oficio"></p>
            <h1 id="nombre"></h1>
            <p class="lugar" id="lugar"></p>
            <div class="datos" id="datos"></div>
            <p class="presentacion" id="presentacion"></p>
        </header>

        <div class="secciones" id="secciones" role="tablist" aria-label="Secciones de la carta"></div>
        <section class="platos" id="platos" aria-label="Platos"></section>

        <div class="acciones">
            <a class="principal" id="botonWhatsapp" target="_blank" rel="noopener">Reservar por WhatsApp</a>
            <a class="secundario" id="botonLlamar">Llamar</a>
            <nav class="redes" id="redes" aria-label="Redes sociales"></nav>
        </div>
    </main>

    <script>
        /* ==================================================================

           fotos: una o más del mismo plato. Si hay varias, rotan solas.
           ================================================================== */

        const LOCAL = {

            lugar: 'Osorno',
            oficio: 'Cocina chilena',
            horario: '13:00 – 23:00',
            presentacion: 'Carta del día. Cada plato con foto, precio y tiempo de cocina.'
        };

        const CONTACTO = {
            telefono: '+56955556666',
            whatsapp: '56955556666',
            mensajeWhatsapp: 'Hola, quiero reservar en Casa Fogón.',
            redes: [
                { red: 'instagram', url: 'https://www.instagram.com/casafogon.demo' },
                { red: 'facebook', url: 'https://www.facebook.com/casafogon.demo' }
            ]
        };

        const SECCIONES = [
            { id: 'entradas', nombre: 'Entradas' },
            { id: 'fondos', nombre: 'Fondos' },
            { id: 'postres', nombre: 'Postres' },
            { id: 'bebestibles', nombre: 'Bebestibles' }
        ];

        const INTERVALO_FOTOS = 4000;

        const PLATOS = [
            {
                seccion: 'entradas',
                titulo: 'Empanadas de pino',
                precio: '$4.500',
                minutos: 15,
                nota: 'Horno. Carne, cebolla, huevo y aceituna.',
                fotos: [
                    'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1534939561126-855b8675edd7?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                seccion: 'entradas',
                titulo: 'Ceviche del día',
                precio: '$8.900',
                minutos: 12,
                nota: 'Pescado fresco, limón, cilantro y cebolla morada.',
                fotos: [
                    'https://images.unsplash.com/photo-1535399831218-d5bd36d1a6b3?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                seccion: 'fondos',
                titulo: 'Completo italiano',
                precio: '$3.900',
                minutos: 10,
                nota: 'Vienesa, palta, tomate y mayo.',
                fotos: [
                    'https://images.unsplash.com/photo-1612392061787-2d078b3e9a1a?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1612392062422-ef11b256e1e0?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1529312266912-b300077eae0a?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                seccion: 'fondos',
                titulo: 'Pastel de choclo',
                precio: '$11.500',
                minutos: 25,
                nota: 'Choclo molido, pino de vacuno y albahaca. Al horno.',
                fotos: [
                    'https://images.unsplash.com/photo-1574484284002-952d92456975?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                seccion: 'fondos',
                titulo: 'Lomo a lo pobre',
                precio: '$13.900',
                minutos: 22,
                nota: 'Lomo, papas fritas, cebolla y dos huevos fritos.',
                fotos: [
                    'https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                seccion: 'fondos',
                titulo: 'Chorrillana para compartir',
                precio: '$14.900',
                minutos: 25,
                nota: 'Papas, carne, cebolla y huevo. Para dos.',
                fotos: [
                    'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1576107232684-127baa5d60c0?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                seccion: 'postres',
                titulo: 'Leche asada',
                precio: '$4.200',
                minutos: 8,
                nota: 'Flan de leche, azúcar quemada.',
                fotos: [
                    'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                seccion: 'postres',
                titulo: 'Kuchen de manzana',
                precio: '$4.800',
                minutos: 10,
                nota: 'Masa mantecosa y manzana. Sur de Chile.',
                fotos: [
                    'https://images.unsplash.com/photo-1568571780765-9276ac8b75a2?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1562007908-859b4ba9e031?auto=format&fit=crop&w=400&q=60'
                ]
            }
        ];

        const BEBESTIBLES = [
            {
                titulo: 'Jugo de naranja',
                precio: '$3.500',
                minutos: 5,
                nota: 'Exprimido al momento.',
                fotos: [
                    'https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=400&q=60',
                    'https://images.unsplash.com/photo-1621506289937-a8e4c609e5c4?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                titulo: 'Jugo de frutilla',
                precio: '$3.800',
                minutos: 5,
                nota: 'Frutilla natural, con o sin leche.',
                fotos: [
                    'https://images.unsplash.com/photo-1505252585461-04db1eb84625?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                titulo: 'Limonada',
                precio: '$3.200',
                minutos: 4,
                nota: 'Limón, agua y un toque de hierbabuena.',
                fotos: [
                    'https://images.unsplash.com/photo-1523677011783-c91d1bbe2f9e?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                titulo: 'Bebida',
                precio: '$2.200',
                minutos: 2,
                nota: 'Lata o vaso. Variedades de la casa.',
                fotos: [
                    'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=400&q=60'
                ]
            },
            {
                titulo: 'Agua mineral',
                precio: '$1.800',
                minutos: 1,
                nota: 'Con o sin gas.',
                fotos: [
                    'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=400&q=60'
                ]
            }
        ];

        /* ==================================================================
           FIN DE LOS DATOS DE LA CARTA
           ================================================================== */

        const ICONOS_REDES = {
            instagram: {
                nombre: 'Instagram',
                viewBox: '0 0 24 24',
                path: 'M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4c0 3.2-2.6 5.8-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2zm0 2C5.7 4 4 5.7 4 7.8v8.4C4 18.3 5.7 20 7.8 20h8.4c2.1 0 3.8-1.7 3.8-3.8V7.8C20 5.7 18.3 4 16.2 4H7.8zM17.5 5.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM12 7a5 5 0 1 1 0 10 5 5 0 1 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 1 0 0-6z'
            },
            facebook: {
                nombre: 'Facebook',
                viewBox: '0 0 24 24',
                path: 'M14.5 4h3V.5h-3.3C10.2.5 9.5 3.4 9.5 5.3V7.5h-3v4h3V23.5h5v-12h3.9l.4-4H14.5z'
            }
        };

        let seccionActiva = 'fondos';
        let carruselTimer = null;

        function fotosDe(plato) {
            if (plato.fotos && plato.fotos.length) return plato.fotos;
            return plato.foto ? [plato.foto] : [];
        }

        function platosFiltrados() {
            if (seccionActiva === 'bebestibles') return BEBESTIBLES;
            return PLATOS.filter((plato) => plato.seccion === seccionActiva);
        }

        function mostrarFoto(pista, puntos, indice) {
            const n = pista.children.length;
            pista.dataset.indice = String(indice);
            pista.style.transform = 'translateX(-' + (indice * 112) + 'px)';
            if (!puntos) return;
            Array.prototype.forEach.call(puntos.children, (punto, i) => {
                punto.classList.toggle('activo', i === indice);
            });
        }

        function arrancarCarruseles() {
            if (carruselTimer) {
                clearInterval(carruselTimer);
                carruselTimer = null;
            }

            const pistas = document.querySelectorAll('.pista');
            const hayVarias = Array.prototype.some.call(pistas, (pista) => {
                return pista.children.length > 1;
            });
            if (!hayVarias) return;

            carruselTimer = setInterval(() => {
                document.querySelectorAll('.pista').forEach((pista) => {
                    const n = pista.children.length;
                    if (n < 2) return;
                    const actual = Number(pista.dataset.indice || 0);
                    const siguiente = (actual + 1) % n;
                    const puntos = pista.parentElement.querySelector('.puntos');
                    mostrarFoto(pista, puntos, siguiente);
                });
            }, INTERVALO_FOTOS);
        }

        function renderSecciones() {
            const nav = document.getElementById('secciones');
            nav.replaceChildren();
            SECCIONES.forEach((seccion) => {
                const boton = document.createElement('button');
                boton.type = 'button';
                boton.textContent = seccion.nombre;
                boton.setAttribute('aria-pressed', seccion.id === seccionActiva ? 'true' : 'false');
                boton.addEventListener('click', () => {
                    seccionActiva = seccion.id;
                    renderSecciones();
                    renderPlatos();
                });
                nav.appendChild(boton);
            });
        }

        function crearTarjeta(plato) {
            const fotos = fotosDe(plato);
            const articulo = document.createElement('article');

            const cuerpo = document.createElement('div');
            cuerpo.className = 'cuerpo-plato';
            cuerpo.innerHTML = '<h3></h3><p class="nota"></p><p class="meta"></p>';
            cuerpo.querySelector('h3').textContent = plato.titulo;
            cuerpo.querySelector('.nota').textContent = plato.nota;
            cuerpo.querySelector('.meta').innerHTML =
                '<span class="precio"></span> · ' + plato.minutos + ' min';
            cuerpo.querySelector('.precio').textContent = plato.precio;

            const foto = document.createElement('div');
            foto.className = 'foto';
            const pista = document.createElement('div');
            pista.className = 'pista';
            pista.dataset.indice = '0';
            fotos.forEach((src) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = plato.titulo;
                img.loading = 'lazy';
                img.referrerPolicy = 'no-referrer';
                pista.appendChild(img);
            });
            foto.appendChild(pista);

            if (fotos.length > 1) {
                const puntos = document.createElement('div');
                puntos.className = 'puntos';
                fotos.forEach((_, i) => {
                    const punto = document.createElement('span');
                    if (i === 0) punto.className = 'activo';
                    puntos.appendChild(punto);
                });
                foto.appendChild(puntos);
            }

            articulo.appendChild(cuerpo);
            articulo.appendChild(foto);
            return articulo;
        }

        function renderPlatos() {
            const lista = document.getElementById('platos');
            lista.replaceChildren();
            platosFiltrados().forEach((plato) => {
                lista.appendChild(crearTarjeta(plato));
            });
            arrancarCarruseles();
        }

        function renderRedes()
            const nav = document.getElementById('redes');
            nav.replaceChildren();
            const NS = 'http://www.w3.org/2000/svg';
            (CONTACTO.redes || []).forEach((item) => {
                const icono = ICONOS_REDES[item.red];
                if (!icono || !item.url) return;
                const enlace = document.createElement('a');
                enlace.className = 'red-social';
                enlace.href = item.url;
                enlace.target = '_blank';
                enlace.rel = 'noopener';
                enlace.setAttribute('aria-label', icono.nombre);
                const svg = document.createElementNS(NS, 'svg');
                svg.setAttribute('viewBox', icono.viewBox);
                svg.setAttribute('aria-hidden', 'true');
                const path = document.createElementNS(NS, 'path');
                path.setAttribute('d', icono.path);
                svg.appendChild(path);
                enlace.appendChild(svg);
                nav.appendChild(enlace);
            });
        }

        function aplicarCarta() {
            document.title = LOCAL.titulo;
            document.getElementById('oficio').textContent = LOCAL.oficio;
            document.getElementById('nombre').textContent = LOCAL.nombre;
            document.getElementById('lugar').textContent = LOCAL.lugar;
            document.getElementById('presentacion').textContent = LOCAL.presentacion;

            const datos = document.getElementById('datos');
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = LOCAL.horario;
            datos.appendChild(chip);

            const wa = 'https://wa.me/' + CONTACTO.whatsapp +
                '?text=' + encodeURIComponent(CONTACTO.mensajeWhatsapp);
            document.getElementById('botonWhatsapp').href = wa;
            document.getElementById('botonLlamar').href = 'tel:' + CONTACTO.telefono;

            if (location.hash === '#bebestibles') seccionActiva = 'bebestibles';

            renderSecciones();
            renderPlatos();
            renderRedes();
        }

        aplicarCarta();
    </script>
</body>
</html>
