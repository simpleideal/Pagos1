<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas de hoy</title>
    <meta name="description" content="Ofertas de hoy de la pastelería. Se actualizan desde una hoja. Datos inventados.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4efe4;
            --card: #fffdf8;
            --line: #e4d8c4;
            --huerto: #2f5d3a;
            --huerto-oscuro: #1f3f28;
            --miel: #c45c26;
            --text: #241c14;
            --muted: #6b5d4e;
            --agotado: #8a3d1d;
            --ok: #25d366;
            --foto: 108px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 80% -10%, #e7d7b8 0%, transparent 42%),
                var(--bg);
            padding: 20px 16px calc(136px + env(safe-area-inset-bottom, 0px));
        }

        main {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        @media (min-width: 860px) {
            main { max-width: 760px; }
            .lista { grid-template-columns: 1fr 1fr; }
            .grupo { grid-column: 1 / -1; }
        }

        header { margin-bottom: 18px; }

        .oficio {
            color: var(--huerto);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-family: Fraunces, Didot, serif;
            font-size: 2.05rem;
            letter-spacing: -0.02em;
            line-height: 1.05;
            margin-bottom: 6px;
        }

        .lugar {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 600;
        }

        .chip.hoy {
            background: var(--huerto);
            border-color: var(--huerto);
            color: #f6fff6;
        }

        .presentacion {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .origen {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.75rem;
        }

        .lista { display: grid; gap: 10px; }

        .grupo {
            font-family: Fraunces, Didot, serif;
            font-size: 1.05rem;
            margin: 10px 0 2px;
            color: var(--huerto-oscuro);
        }

        article {
            display: flex;
            gap: 12px;
            align-items: stretch;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            position: relative;
            overflow: hidden;
        }

        article.agotado { opacity: 0.62; }
        article.agotado .foto img { filter: grayscale(1); }

        .cuerpo {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        article h3 {
            font-family: Fraunces, Didot, serif;
            font-size: 1.12rem;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .nota {
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.4;
            flex: 1;
        }

        .precios {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 10px;
        }

        .antes {
            color: var(--muted);
            font-size: 0.82rem;
            text-decoration: line-through;
        }

        .ahora {
            color: var(--miel);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .dto {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--huerto);
            background: #e7f0e4;
            border-radius: 999px;
            padding: 3px 8px;
        }

        .cupo {
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 600;
        }

        .foto {
            position: relative;
            width: var(--foto);
            height: var(--foto);
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #e8dcc8;
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sello {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 2;
            background: var(--agotado);
            color: #fffdf8;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 7px;
            border-radius: 6px;
        }

        .vacio, .carga, .error {
            background: var(--card);
            border: 1px dashed var(--line);
            border-radius: 16px;
            padding: 28px 18px;
            text-align: center;
        }

        .vacio h2, .error h2 {
            font-family: Fraunces, Didot, serif;
            font-size: 1.35rem;
            margin: 8px 0 8px;
        }

        .vacio p, .error p, .carga p {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .pastel {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            color: var(--huerto);
        }

        .esqueleto {
            height: 132px;
            border-radius: 16px;
            background: linear-gradient(90deg, #efe6d6 25%, #f7f1e6 50%, #efe6d6 75%);
            background-size: 200% 100%;
            animation: brillo 1.1s ease infinite;
        }

        @keyframes brillo {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .barra {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: min(440px, 100%);
            padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(180deg, transparent, var(--bg) 28%);
            z-index: 20;
        }

        @media (min-width: 860px) {
            .barra { width: min(760px, 100%); }
        }

        .barra a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            border-radius: 12px;
            padding: 13px 14px;
            font-weight: 700;
        }

        .wa {
            background: var(--ok);
            color: #073b1a;
        }

        .wa svg { width: 18px; height: 18px; fill: currentColor; }

        .llamar {
            margin-top: 8px;
            border: 1px solid var(--huerto);
            color: var(--huerto-oscuro);
            background: var(--card);
        }

        footer {
            margin-top: 22px;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.45;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="oficio" id="oficio"></p>
            <h1 id="nombre"></h1>
            <p class="lugar" id="lugar"></p>
            <div class="chips" id="chips"></div>
            <p class="presentacion" id="presentacion"></p>
            <p class="origen" id="origen"></p>
        </header>

        <section class="lista" id="lista" aria-live="polite" aria-label="Ofertas de hoy"></section>

        <footer id="pie"></footer>
    </main>

    <div class="barra" id="barra" hidden>
        <a class="wa" id="botonWhatsapp" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.22 8.22 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.39-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.32a8.23 8.23 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24zM8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.87.85-.87 2.07 0 1.22.89 2.39 1.01 2.56.12.17 1.73 2.78 4.27 3.79 2.11.85 2.54.68 3 .64.46-.05 1.48-.6 1.69-1.18.21-.58.21-1.07.15-1.18-.06-.1-.22-.17-.46-.3-.24-.13-1.47-.73-1.7-.81-.22-.08-.39-.13-.56.13-.17.25-.65.81-.8.97-.15.17-.29.19-.53.06-.24-.13-1.03-.38-1.96-1.21-.72-.64-1.21-1.44-1.35-1.68-.14-.25-.02-.38.11-.51.11-.11.24-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.35-.76-1.84-.2-.48-.4-.42-.56-.42z"/></svg>
            Reservar estas ofertas
        </a>
        <a class="llamar" id="botonLlamar">Llamar al local</a>
    </div>

    <script>
        /* ==================================================================
           DATOS DE LA VITRINA

           hoja: URL de Google Sheets (lector). El local no toca esto.
           pestana: nombre de la pestaña (hoy: Hoja 1; el archivo se llama vitrina).
           Escribir plantillas: secreto GOOGLE_SERVICE_ACCOUNT_JSON
           (Cursor Secrets, no git). No marcar hoy por el local.
           ================================================================== */

        const LOCAL = {
            titulo: 'Ofertas de hoy - Huerto Dulce',
            nombre: 'Huerto Dulce',
            lugar: 'Osorno',
            oficio: 'Pastelería · ofertas de hoy',
            horario: 'Retiro hasta las 20:30',
            direccion: 'Mackenna 1180',
            maps: 'https://www.google.com/maps?q=Osorno+Chile',
            presentacion: 'Lo que quedó del día, con nombre y precio. No es la carta completa. Pagas al retirar.'
        };

        const CONTACTO = {
            telefono: '+56955557777',
            whatsapp: '56955557777',
            instagram: 'https://www.instagram.com/huertodulce.demo'
        };

        const FUENTE = {
            hoja: 'https://docs.google.com/spreadsheets/d/1EWSAq8OtKFsNgJCNUAWDdCjQRloo_B24kZjsLPOuizQ/edit?usp=sharing',
            pestana: 'Hoja 1',
            csvLocal: 'datos/ofertas.csv'
        };

        /* ==================================================================
           FIN DE LOS DATOS DE LA VITRINA
           ================================================================== */

        const ALIAS = {
            producto: ['producto', 'product', 'name', 'nombre', 'item', 'dish', 'titulo', 'title'],
            precio_normal: ['precio_normal', 'precionormal', 'precio', 'price', 'precio_lista', 'regular'],
            precio_oferta: ['precio_oferta', 'preciooferta', 'oferta', 'sale', 'precio_hoy', 'promo'],
            hoy: ['hoy', 'today', 'del_dia', 'deldia'],
            activo: ['activo', 'active', 'visible'],
            disponible: ['disponible', 'stok', 'available'],
            nota: ['nota', 'description', 'descripcion', 'desc', 'detalle'],
            foto: ['foto', 'image', 'imagen', 'image_url', 'imageurl', 'photo'],
            unidades: ['unidades', 'stock', 'qty', 'cantidad'],
            categoria: ['categoria', 'category', 'seccion', 'section']
        };

        const CANON = {};
        Object.keys(ALIAS).forEach(function (canon) {
            ALIAS[canon].forEach(function (a) { CANON[a] = canon; });
        });

        function clave(texto) {
            const limpio = String(texto || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_|_$/g, '');
            return CANON[limpio] || limpio;
        }

        function esc(texto) {
            return String(texto)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function esSi(valor) {
            const s = String(valor || '').trim().toLowerCase();
            return s === 'si' || s === 'sí' || s === 'true' || s === '1' || s === 'yes' || s === 'x';
        }

        function esNo(valor) {
            const s = String(valor || '').trim().toLowerCase();
            return s === 'no' || s === 'false' || s === '0';
        }

        function pesos(n) {
            const x = Number(String(n).replace(/[^\d]/g, ''));
            if (!x) return '';
            return '$' + x.toLocaleString('es-CL');
        }

        function numero(n) {
            const x = Number(String(n).replace(/[^\d]/g, ''));
            return x || 0;
        }

        function hoyChileno(fecha) {
            return fecha.toLocaleDateString('es-CL', {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            });
        }

        function parsearCsv(texto) {
            const filas = [];
            let fila = [];
            let celda = '';
            let enComillas = false;
            const s = String(texto || '').replace(/^\uFEFF/, '');
            for (let i = 0; i < s.length; i += 1) {
                const c = s[i];
                const n = s[i + 1];
                if (enComillas) {
                    if (c === '"' && n === '"') { celda += '"'; i += 1; }
                    else if (c === '"') enComillas = false;
                    else celda += c;
                } else if (c === '"') {
                    enComillas = true;
                } else if (c === ',') {
                    fila.push(celda);
                    celda = '';
                } else if (c === '\n' || (c === '\r' && n === '\n')) {
                    if (c === '\r') i += 1;
                    fila.push(celda);
                    celda = '';
                    if (fila.some(function (x) { return String(x).trim() !== ''; })) filas.push(fila);
                    fila = [];
                } else if (c !== '\r') {
                    celda += c;
                }
            }
            fila.push(celda);
            if (fila.some(function (x) { return String(x).trim() !== ''; })) filas.push(fila);
            if (!filas.length) return [];
            const keys = filas[0].map(clave);
            return filas.slice(1).map(function (cols) {
                const o = {};
                keys.forEach(function (k, i) {
                    if (k) o[k] = String(cols[i] || '').trim();
                });
                return o;
            });
        }

        function filasDesdeJson(data) {
            if (!Array.isArray(data)) return [];
            return data.map(function (row) {
                const o = {};
                Object.keys(row || {}).forEach(function (k) {
                    o[clave(k)] = String(row[k] == null ? '' : row[k]).trim();
                });
                return o;
            });
        }

        function resolverFuente(entrada, pestana) {
            const t = String(entrada || '').trim();
            if (!t) return { tipo: 'csv', url: FUENTE.csvLocal, etiqueta: 'CSV local de muestra' };
            if (/opensheet\.(elk\.sh|vercel\.app)/i.test(t)) {
                return { tipo: 'json', url: t, etiqueta: 'Hoja (opensheet)' };
            }
            if (/\.csv(\?|$)/i.test(t) || /output=csv/i.test(t) || /tqx=out:csv/i.test(t)) {
                return { tipo: 'csv', url: t, etiqueta: 'CSV de la hoja' };
            }
            const pub = t.match(/\/spreadsheets\/d\/e\/([^/]+)/);
            if (pub) {
                return {
                    tipo: 'csv',
                    url: 'https://docs.google.com/spreadsheets/d/e/' + pub[1] + '/pub?output=csv',
                    etiqueta: 'Hoja publicada'
                };
            }
            const id = t.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
            if (id) {
                const gid = (t.match(/[?&#]gid=([0-9]+)/) || [])[1];
                const url = gid
                    ? 'https://docs.google.com/spreadsheets/d/' + id[1] + '/gviz/tq?tqx=out:csv&gid=' + gid
                    : 'https://docs.google.com/spreadsheets/d/' + id[1] + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(pestana || 'ofertas');
                return { tipo: 'csv', url: url, etiqueta: 'Hoja de Google' };
            }
            if (/^[a-zA-Z0-9-_]{20,}$/.test(t)) {
                return {
                    tipo: 'json',
                    url: 'https://opensheet.elk.sh/' + t + '/' + encodeURIComponent(pestana || '1'),
                    etiqueta: 'Hoja (opensheet)'
                };
            }
            return { tipo: 'csv', url: t, etiqueta: 'CSV' };
        }

        function esActivo(fila) {
            if (fila.activo === undefined || String(fila.activo).trim() === '') return true;
            return !esNo(fila.activo);
        }

        function esHoy(fila) {
            return esSi(fila.hoy);
        }

        function unidadesDe(fila) {
            const bruto = String(fila.unidades || '').trim().toLowerCase();
            if (bruto === 'agotado') return 0;
            if (bruto === '') return null;
            const n = parseInt(bruto.replace(/[^\d-]/g, ''), 10);
            return Number.isFinite(n) ? n : null;
        }

        function estaAgotado(fila) {
            if (unidadesDe(fila) === 0) return true;
            if (fila.disponible !== undefined && String(fila.disponible).trim() !== '' && esNo(fila.disponible)) return true;
            return false;
        }

        function visiblesDe(filas) {
            const tieneHoy = filas.some(function (f) {
                return f.hoy !== undefined && String(f.hoy).trim() !== '';
            });
            return filas.filter(function (f) {
                if (!f.producto) return false;
                if (!esActivo(f)) return false;
                if (tieneHoy && !esHoy(f)) return false;
                return true;
            });
        }

        function fotoValida(url) {
            const u = String(url || '').trim();
            if (!u) return false;
            if (/^https?:\/\//i.test(u)) return true;
            if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return false;
            return !u.startsWith('//');
        }

        function descuento(fila) {
            const normal = numero(fila.precio_normal);
            const oferta = numero(fila.precio_oferta) || normal;
            if (!normal || oferta >= normal) return 0;
            return Math.round((1 - (oferta / normal)) * 100);
        }

        async function cargarTexto(url) {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error('http ' + res.status);
            return res.text();
        }

        async function cargarFilas(fuente) {
            if (fuente.tipo === 'json') {
                const res = await fetch(fuente.url, { cache: 'no-store' });
                if (!res.ok) throw new Error('http ' + res.status);
                return filasDesdeJson(await res.json());
            }
            return parsearCsv(await cargarTexto(fuente.url));
        }

        function mensajeWhatsapp(items) {
            const disponibles = items.filter(function (f) { return !estaAgotado(f); });
            const lineas = [
                'Hola, vi las ofertas de hoy en ' + LOCAL.nombre + ':',
                ''
            ];
            if (!disponibles.length) {
                lineas.push('Quiero preguntar si queda algo para retirar.');
            } else {
                disponibles.forEach(function (f) {
                    const ahora = pesos(numero(f.precio_oferta) || numero(f.precio_normal));
                    const antes = pesos(f.precio_normal);
                    let linea = '• ' + f.producto + ' — ' + ahora;
                    if (antes && ahora && antes !== ahora) linea += ' (antes ' + antes + ')';
                    lineas.push(linea);
                });
                lineas.push('');
                lineas.push('Quiero reservar:');
            }
            return lineas.join('\n');
        }

        function tarjeta(fila) {
            const agotado = estaAgotado(fila);
            const ahoraN = numero(fila.precio_oferta) || numero(fila.precio_normal);
            const antesN = numero(fila.precio_normal);
            const dto = descuento(fila);
            const cupo = unidadesDe(fila);
            const fotoOk = fotoValida(fila.foto);
            let html = '<article' + (agotado ? ' class="agotado"' : '') + '>';
            html += '<div class="cuerpo">';
            html += '<h3>' + esc(fila.producto) + '</h3>';
            if (fila.nota) html += '<p class="nota">' + esc(fila.nota) + '</p>';
            html += '<div class="precios">';
            if (antesN && ahoraN && antesN !== ahoraN) {
                html += '<span class="antes">' + esc(pesos(antesN)) + '</span>';
            }
            if (ahoraN) html += '<span class="ahora">' + esc(pesos(ahoraN)) + '</span>';
            if (dto) html += '<span class="dto">-' + dto + '%</span>';
            if (!agotado && cupo !== null && cupo > 0) {
                html += '<span class="cupo">' + cupo + (cupo === 1 ? ' unidad' : ' unidades') + '</span>';
            }
            html += '</div></div>';
            html += '<div class="foto">';
            if (agotado) html += '<span class="sello">Agotado</span>';
            if (fotoOk) {
                html += '<img src="' + esc(fila.foto) + '" alt="" width="108" height="108">';
            }
            html += '</div></article>';
            return html;
        }

        function pintarLista(items) {
            const caja = document.getElementById('lista');
            if (!items.length) {
                caja.innerHTML =
                    '<div class="vacio">' +
                    '<svg class="pastel" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M8 38h48l-4 16H12L8 38zm4-6a20 14 0 0 1 40 0H12zm20-18c2 0 4 2 4 4s-2 3-4 3-4-1-4-3 2-4 4-4z"/></svg>' +
                    '<h2>Hoy no hay ofertas</h2>' +
                    '<p>El local todavía no marcó sobras en la hoja, o se acabaron. Vuelve más tarde o escribe por WhatsApp.</p>' +
                    '</div>';
                return;
            }
            const categorias = [];
            items.forEach(function (f) {
                const c = f.categoria || '';
                if (categorias.indexOf(c) === -1) categorias.push(c);
            });
            const agrupa = categorias.length > 1 || (categorias.length === 1 && categorias[0]);
            let html = '';
            if (!agrupa) {
                items.forEach(function (f) { html += tarjeta(f); });
            } else {
                categorias.forEach(function (c) {
                    const deEsta = items.filter(function (f) { return (f.categoria || '') === c; });
                    if (!deEsta.length) return;
                    if (c) html += '<h2 class="grupo">' + esc(c) + '</h2>';
                    deEsta.forEach(function (f) { html += tarjeta(f); });
                });
            }
            caja.innerHTML = html;
        }

        function pintarCabecera(origen) {
            document.title = LOCAL.titulo;
            document.getElementById('oficio').textContent = LOCAL.oficio;
            document.getElementById('nombre').textContent = LOCAL.nombre;
            document.getElementById('lugar').textContent = LOCAL.lugar + (LOCAL.direccion ? ' · ' + LOCAL.direccion : '');
            document.getElementById('presentacion').textContent = LOCAL.presentacion;
            document.getElementById('origen').textContent = origen;
            const chips = document.getElementById('chips');
            chips.innerHTML = '';
            const hoy = document.createElement('span');
            hoy.className = 'chip hoy';
            hoy.textContent = 'Hoy · ' + hoyChileno(new Date());
            chips.appendChild(hoy);
            if (LOCAL.horario) {
                const h = document.createElement('span');
                h.className = 'chip';
                h.textContent = LOCAL.horario;
                chips.appendChild(h);
            }
            document.getElementById('pie').textContent =
                'Pagas al retirar. El llavero NFC y el QR abren esta misma página. Datos inventados.';
        }

        function pintarBarra(items) {
            const barra = document.getElementById('barra');
            const wa = document.getElementById('botonWhatsapp');
            const llamar = document.getElementById('botonLlamar');
            barra.hidden = false;
            wa.href = 'https://wa.me/' + CONTACTO.whatsapp +
                '?text=' + encodeURIComponent(mensajeWhatsapp(items));
            llamar.href = 'tel:' + CONTACTO.telefono;
        }

        function consulta() {
            const q = new URLSearchParams(location.search);
            return {
                csv: q.get('csv') || '',
                hoja: q.get('hoja') || FUENTE.hoja
            };
        }

        async function iniciar() {
            const lista = document.getElementById('lista');
            lista.innerHTML = '<div class="carga"><div class="esqueleto"></div></div>' +
                '<div class="esqueleto"></div><div class="esqueleto"></div>';
            const q = consulta();
            const pedida = q.csv
                ? { tipo: 'csv', url: q.csv, etiqueta: 'CSV de prueba' }
                : resolverFuente(q.hoja, FUENTE.pestana);
            pintarCabecera('Cargando ' + pedida.etiqueta + '…');
            let filas = [];
            let origen = pedida.etiqueta;
            try {
                filas = await cargarFilas(pedida);
            } catch (err) {
                console.warn('No se pudo leer la fuente pedida, se usa el CSV local.', err);
                try {
                    filas = await cargarFilas({ tipo: 'csv', url: FUENTE.csvLocal });
                    origen = 'Copia local (la hoja no respondió)';
                } catch (err2) {
                    pintarCabecera('Sin datos');
                    lista.innerHTML =
                        '<div class="error"><h2>No se pudo cargar la vitrina</h2>' +
                        '<p>Revisa la conexión o el enlace de la hoja.</p></div>';
                    pintarBarra([]);
                    return;
                }
            }
            const hayProductos = filas.some(function (f) { return f.producto; });
            if (!hayProductos && !q.csv && FUENTE.csvLocal) {
                try {
                    const local = await cargarFilas({ tipo: 'csv', url: FUENTE.csvLocal });
                    if (local.some(function (f) { return f.producto; })) {
                        filas = local;
                        origen = 'Hoja conectada, todavía vacía · se muestra la muestra';
                    }
                } catch (err3) {
                    console.warn('CSV local no disponible.', err3);
                }
            }
            const items = visiblesDe(filas);
            pintarCabecera(origen + ' · se actualiza sola cuando cambia la hoja');
            pintarLista(items);
            pintarBarra(items);
        }

        iniciar();
    </script>
</body>
</html>
