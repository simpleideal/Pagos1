<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bry Paradise - Datos de Transferencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        :root {
            --card-bg: rgba(45, 25, 40, 0.92);
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #c9a0b5;
            --success: #22c55e;
            --border-color: rgba(244, 114, 182, 0.25);
            --field-bg: rgba(200, 100, 140, 0.20);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* IMPORTANTE: Descarga la imagen y úsala localmente (ej: assets/fondo.webp). 
               El hotlink a Unsplash eventualmente bloqueará la petición. */
            background: #2d1928 url('https://images.unsplash.com/photo-1607457561901-e6ec3a6d16cf?fm=jpg&q=60&w=3000&auto=format&fit=crop') center/cover fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Padding inferior añadido para que el botón flotante no tape el footer en móviles */
            padding: 20px 20px 90px 20px; 
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 {
            font-size: 1.15rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        .header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

        .field-group {
            margin-bottom: 12px;
            background: var(--field-bg);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(244, 114, 182, 0.1);
        }

        .field-info { display: flex; flex-direction: column; overflow: hidden; padding-right: 8px; width: 100%; }
        .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 0.95rem; font-weight: 600; margin-top: 2px; word-break: break-word; }
        .value.small-text { font-size: 0.8rem; }

        .btn-copy {
            background-color: var(--accent);
            color: #1a0d15;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .btn-copy:hover, .btn-copy-all:hover { filter: brightness(1.1); }
        .btn-copy.copied, .btn-copy-all.copied { background-color: var(--success); color: #fff; }

        .btn-copy-all, .vcard-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-copy-all { background-color: var(--accent); color: #1a0d15; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .btn-copy-all:active { transform: scale(0.97); }
        
        .vcard-btn { background-color: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .vcard-btn:active { background-color: rgba(244, 114, 182, 0.15); }

        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 58px;
            height: 58px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            transition: transform 0.2s ease;
        }
        .whatsapp-float:active { transform: scale(0.9); }
        .whatsapp-float svg { width: 32px; height: 32px; fill: #ffffff; }

        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
        .footer .social-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }
        .social-icons { display: flex; justify-content: center; gap: 18px; }
        .social-icons a { color: var(--text-muted); font-size: 1.6rem; transition: all 0.3s ease; }
        .social-icons a:hover { color: var(--accent); transform: scale(1.15); }
    </style>
</head>
<body>

    <!-- Uso de etiquetas semánticas (main, header, footer) en lugar de puros divs -->
    <main class="card">
        <header class="header">
            <h1>🌸 Bry Paradise</h1>
            <p>Datos de Transferencia Bancaria</p>
        </header>

        <!-- Se añaden atributos data-label y data-value. Esto convierte al HTML en la única fuente de verdad -->
        <div id="datos-transferencia">
            <div class="field-group">
                <div class="field-info">
                    <span class="label">Titular</span>
                    <span class="value" data-label="Nombre" data-value="Jose Barrientos">Jose Barrientos</span>
                </div>
            </div>

            <div class="field-group">
                <div class="field-info">
                    <span class="label">RUT</span>
                    <span class="value" data-label="RUT" data-value="20.523.380-6">20.523.380-6</span>
                </div>
                <button class="btn-copy" onclick="copyText('20.523.380-6', this)" aria-label="Copiar RUT">Copiar</button>
            </div>

            <div class="field-group">
                <div class="field-info">
                    <span class="label">Banco</span>
                    <span class="value" data-label="Banco" data-value="Banco de Chile">Banco de Chile</span>
                </div>
            </div>

            <div class="field-group">
                <div class="field-info">
                    <span class="label">Tipo de Cuenta</span>
                    <span class="value" data-label="Tipo de Cuenta" data-value="Cuenta Vista">Cuenta Vista</span>
                </div>
            </div>

            <div class="field-group">
                <div class="field-info">
                    <span class="label">N° de Cuenta</span>
                    <span class="value" data-label="Número de Cuenta" data-value="00-020-08220-11">00-020-08220-11</span>
                </div>
                <!-- El botón individual también entrega el número limpio de guiones -->
                <button class="btn-copy" onclick="copyText('000200822011', this)" aria-label="Copiar Número de Cuenta">Copiar</button>
            </div>

            <div class="field-group">
                <div class="field-info">
                    <span class="label">Correo Confirmación</span>
                    <span class="value small-text" data-label="Correo" data-value="joserespaldo4@gmail.com">joserespaldo4@gmail.com</span>
                </div>
                <button class="btn-copy" onclick="copyText('joserespaldo4@gmail.com', this)" aria-label="Copiar Correo">Copiar</button>
            </div>
        </div>

        <button id="copyAllBtn" class="btn-copy-all" onclick="copyAllData()">
            📋 Copiar Todos los Datos
        </button>

        <button class="vcard-btn" onclick="downloadVCard()">📇 Guardar Contacto en Agenda</button>

        <footer class="footer">
            <span class="social-label">Síguenos en redes</span>
            <div class="social-icons">
                <a href="https://www.instagram.com/boutique_bryy?igsi=dnE3bWZ5amVjeHJx" target="_blank" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/share/19Cg8w2pWA/" target="_blank" aria-label="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <!-- Enlace vacío de TikTok eliminado. Generaba errores de navegación y saltos visuales -->
            </div>
        </footer>
    </main>

    <a href="https://wa.me/56967509800?text=Hola%20Jose,%20te%20env%C3%ADo%20el%20comprobante%20de%20la%20transferencia." class="whatsapp-float" target="_blank" aria-label="Enviar comprobante por WhatsApp">
        <svg viewBox="0 0 32 32">
            <path d="M16 2a13 13 0 0 0-11.2 19.6L3 29l7.7-2A13 13 0 1 0 16 2zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-4 1 1-3.9-.3-.5A10.6 10.6 0 1 1 16 25.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-.9 1.2-.3.2-.6 0a8 8 0 0 1-2.4-1.5 8.9 8.9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6s.3-.4.4-.6a1.7 1.7 0 0 0 .3-.5.6.6 0 0 0 0-.5c0-.2-.7-1.7-1-2.3s-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.2 2.7 6.4 6.4 0 0 0 1.3 3.4 14.7 14.7 0 0 0 5.7 5 19 19 0 0 0 1.9.7 4.6 4.6 0 0 0 2.1.1 3.4 3.4 0 0 0 2.2-1.6 2.8 2.8 0 0 0 .2-1.5c-.1-.1-.3-.2-.6-.4z"/>
        </svg>
    </a>

    <script>
        // Función centralizada para manejar el feedback visual de los botones
        function triggerFeedback(btn, tempText, className) {
            const originalText = btn.dataset.originalText || btn.innerText;
            if (!btn.dataset.originalText) btn.dataset.originalText = originalText;
            
            btn.innerText = tempText;
            if (className) btn.classList.add(className);
            
            setTimeout(() => {
                btn.innerText = originalText;
                if (className) btn.classList.remove(className);
            }, 2000);
        }

        async function copyText(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
                if (navigator.vibrate) navigator.vibrate(50);
                triggerFeedback(btn, "¡Copiado!", "copied");
            } catch (err) {
                triggerFeedback(btn, "Error al copiar", "");
            }
        }

        async function copyAllData() {
            const btn = document.getElementById('copyAllBtn');
            const nodos = document.querySelectorAll('.value');
            
            let textoPlano = "";
            nodos.forEach(nodo => {
                const etiqueta = nodo.getAttribute('data-label');
                let valor = nodo.getAttribute('data-value');
                
                // Limpieza estricta de cuenta bancaria
                if (etiqueta === "Número de Cuenta") {
                    valor = valor.replace(/[^0-9]/g, '');
                }
                
                textoPlano += `${etiqueta}: ${valor}\n`;
            });

            try {
                await navigator.clipboard.writeText(textoPlano.trim());
                if (navigator.vibrate) navigator.vibrate(50);
                triggerFeedback(btn, "✅ ¡Todos Copiados!", "copied");
            } catch (err) {
                console.error("Fallo de API Clipboard", err);
                triggerFeedback(btn, "❌ Copia manual requerida", "");
            }
        }

        function downloadVCard() {
            // Reutiliza los datos directamente del DOM sin hardcodear
            const nodos = document.querySelectorAll('.value');
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
FN:${nodos[0].getAttribute('data-value')}
ORG:Bry Paradise
EMAIL:${nodos[5].getAttribute('data-value')}
TEL:+56967509800
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Transferencia_Bry_Paradise.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url); // Fundamental para evitar fugas de memoria en navegadores móviles
        }
    </script>
</body>
</html>
